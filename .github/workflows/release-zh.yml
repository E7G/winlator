name: Build and Release Ludashi 4.0 Chinese

on:
  push:
    branches:
      - sync/ludashi-4.0-zh
    paths:
      - .github/workflows/release-zh.yml
      - tools/check_zh_strings.py
      - app/src/main/res/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Simplified Chinese localization
        run: python3 tools/check_zh_strings.py

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUT="Winlator-Ludashi-4.0-E7G-ZH-CN-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-4.0-E7G-ZH-CN
          path: |
            ${{ steps.asset.outputs.path }}
            ${{ steps.asset.outputs.path }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v4.0-E7G-zh.1
          APK: ${{ steps.asset.outputs.path }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'EOF'
          Winlator Ludashi 4.0 E7G 简体中文版

          - 基于 StevenMXZ/Winlator-Ludashi 4.0 最新分支同步
          - 上游基线：18c28e5f53e570ffb33a6655e15405212f67ed6e
          - 补齐 Ludashi 4.0 新增中文字符串
          - 将上游硬编码的主要界面英文资源化并汉化
          - 保留 Winlator、DXVK、VKD3D、Box64、FPS、GPU 等技术名称
          - arm64-v8a Release APK
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "Winlator Ludashi 4.0 E7G 中文版" --notes "$NOTES"
          fi
