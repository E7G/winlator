name: Chinese localization check

on:
  push:
    branches:
      - sync/ludashi-4.0-zh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Simplified Chinese coverage
        run: python3 tools/check_zh_strings.py
