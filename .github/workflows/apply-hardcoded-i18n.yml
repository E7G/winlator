name: Apply hardcoded Chinese UI localization

on:
  push:
    branches:
      - fix/zh-cn-downloads-v2
    paths:
      - tools/apply_zh_hardcoded_ui.py
      - .github/workflows/apply-hardcoded-i18n.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zh-cn-downloads-v2
          fetch-depth: 0
      - name: Validate localization script
        run: python3 -m py_compile tools/apply_zh_hardcoded_ui.py
      - name: Apply localized UI literals
        run: python3 tools/apply_zh_hardcoded_ui.py
      - name: Commit localized sources
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "fix(i18n): localize hardcoded Java and Compose UI"
          git push origin HEAD:fix/zh-cn-downloads-v2
