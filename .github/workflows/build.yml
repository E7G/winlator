name: Android CI & Release

on:
  push:
    branches:
      - main
      - integration/ludashi-3.1-plus
      - feature/dac-ahb-root-perf
      - feature/end-to-end-dxvk-ahb-proton11
      - feature/universal-super-resolution
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: winlator-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare libadrenotools
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git app/src/main/cpp/adrenotools
          git -C app/src/main/cpp/adrenotools checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone --depth 1 https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools zstd xz-utils jq

      - name: Prepare bundled GameNative Proton 11 ARM64EC
        shell: bash
        env:
          PROTON_ID: proton-11.0-2.20260829-arm64ec
          PROTON_WCP_URL: https://github.com/GameNative/proton-wine/releases/download/proton-11.0-2-20260829/proton-wine-11.0-2-arm64ec.wcp.xz
          PROTON_WCP_SHA256: f3775cbd579203faf041c170906234586ad47159507b491335f9a78c5b531edf
        run: |
          set -euxo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          WCP="$TMP/proton.wcp"
          EXTRACTED="$TMP/wcp"
          PACKAGE="$TMP/package"
          mkdir -p "$EXTRACTED" "$PACKAGE"

          curl -fL --retry 5 --retry-delay 2 "$PROTON_WCP_URL" -o "$WCP"
          echo "$PROTON_WCP_SHA256  $WCP" | sha256sum -c -

          if tar --zstd -tf "$WCP" >/dev/null 2>&1; then
            tar --zstd -xf "$WCP" -C "$EXTRACTED"
          elif tar -Jtf "$WCP" >/dev/null 2>&1; then
            tar -Jxf "$WCP" -C "$EXTRACTED"
          else
            echo "Unsupported Proton WCP compression" >&2
            exit 1
          fi

          PROFILE="$(find "$EXTRACTED" -name profile.json -type f -print -quit)"
          test -n "$PROFILE"
          PROFILE_DIR="$(dirname "$PROFILE")"
          BIN_PATH="$(jq -r '.wine.binPath' "$PROFILE")"
          PREFIX_PATH="$(jq -r '.wine.prefixPack' "$PROFILE")"
          test -n "$BIN_PATH"
          test "$BIN_PATH" != "null"

          WINE_ROOT_REL="$(dirname "$BIN_PATH")"
          WINE_ROOT="$PROFILE_DIR/$WINE_ROOT_REL"
          test -d "$WINE_ROOT/bin"

          # Preserve symlinks/permissions from the WCP runtime.
          cp -a "$WINE_ROOT/." "$PACKAGE/"

          if [ -n "$PREFIX_PATH" ] && [ "$PREFIX_PATH" != "null" ]; then
            PREFIX_SRC="$PROFILE_DIR/$PREFIX_PATH"
            if [ -f "$PREFIX_SRC" ]; then
              cp -a "$PREFIX_SRC" "$PACKAGE/prefixPack.txz"
            fi
          fi

          test -d "$PACKAGE/bin"
          test -e "$PACKAGE/bin/wine" -o -e "$PACKAGE/bin/wine64"
          test -f "$PACKAGE/prefixPack.txz"

          rm -f "app/src/main/assets/$PROTON_ID.tar.zst"
          tar --zstd -cf "app/src/main/assets/$PROTON_ID.tar.zst" -C "$PACKAGE" .
          echo "Bundled $PROTON_ID:"
          du -h "app/src/main/assets/$PROTON_ID.tar.zst"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          if [ -z "$VERSION" ]; then VERSION="3.1-E7G"; fi
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist
          APK="dist/Winlator-Ludashi-E7G-${VERSION}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-E7G-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.package.outputs.apk }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euxo pipefail
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          TITLE="Winlator Ludashi E7G ${VERSION} · Build ${GITHUB_RUN_NUMBER}"
          NOTES="Automated Android build from commit ${GITHUB_SHA}.

          Base: Ludashi 3.1
          Integration: E7G maintained branch
          Highlights:
          - End-to-end DXVK AHardwareBuffer Direct Render with SurfaceFlinger presentation
          - Dynamic AHB swapchain pool reallocation and Vulkan/DRI3 fallback
          - Bundled GameNative Proton 11.0-2 ARM64EC (2026-08-29 test build)
          - GameNative userspace ntsync runtime retained\n          - Test2: bundled P11 forces PROTON_NO_NTSYNC=1, WINEFSYNC=0, WINEESYNC=0 to isolate loading hangs
          - Root extreme performance mode retained
          - Snapdragon GSR quality spatial upscaling with edge-direction reconstruction
          - Proton 11 is the actual bundled/default compatibility layer; startup reinstall loop fixed
          APK is a debug-signed installable build produced by GitHub Actions."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
