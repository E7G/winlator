name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/a5xx-vulkan-refresh-20260922

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone libadrenotools specific commit
        run: |
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools
          cd app/src/main/cpp/adrenotools
          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass inside adrenotools
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      - name: Prepare upstream Vortek runtime
        run: |
          chmod +x scripts/prepare-vortek.sh
          scripts/prepare-vortek.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure() && steps.gradle-build.outcome == 'failure'
        run: |
          echo '===== build.log tail ====='
          tail -n 500 build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vortek-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn

      - name: Split APK for reliable download
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p apk-parts
          split -b 190M -d -a 2 "$APK" apk-parts/winlator.apk.part-
          sha256sum "$APK" > apk-parts/APK-SHA256.txt
          sha256sum apk-parts/winlator.apk.part-* > apk-parts/PARTS-SHA256.txt
          ls -lh apk-parts

      - name: Upload APK metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bionic-Vortek-Metadata-${{ github.run_number }}
          path: |
            apk-parts/APK-SHA256.txt
            apk-parts/PARTS-SHA256.txt
          if-no-files-found: error

      - name: Upload APK part 00
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bionic-Vortek-Part00-${{ github.run_number }}
          path: apk-parts/winlator.apk.part-00
          compression-level: 0
          if-no-files-found: error

      - name: Upload APK part 01
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bionic-Vortek-Part01-${{ github.run_number }}
          path: apk-parts/winlator.apk.part-01
          compression-level: 0
          if-no-files-found: error

      - name: Upload APK part 02
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bionic-Vortek-Part02-${{ github.run_number }}
          path: apk-parts/winlator.apk.part-02
          compression-level: 0
          if-no-files-found: error
