name: Apply Chinese localization

on:
  push:
    branches:
      - sync/ludashi-4.0-zh
    paths:
      - tools/apply_full_zh_xml.py
      - .github/workflows/apply-i18n.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply localization migration
        run: python3 tools/apply_full_zh_xml.py
      - name: Commit generated localization
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No localization changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res app/src/main/java
          git commit -m "feat(i18n): fully localize Ludashi 4.0 UI"
          git push origin HEAD:sync/ludashi-4.0-zh
